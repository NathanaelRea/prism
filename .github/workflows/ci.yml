name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      # v2
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        if: runner.os != 'Windows'
        with:
          tool: nextest@0.9.143
      - name: Install SQLx CLI 0.8.6
        if: runner.os != 'Windows'
        run: >-
          cargo install sqlx-cli --version 0.8.6 --locked
          --no-default-features --features sqlite,rustls
      # v2.9.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install OpenCode
        run: npm install --global opencode-ai@1.17.20
      - name: Install Linux integration dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep tmux
      - name: Install macOS integration dependencies
        if: runner.os == 'macOS'
        run: brew install ripgrep tmux
      - name: Install Worktrunk 0.71.0
        if: runner.os != 'Windows'
        run: |
          release="https://github.com/max-sixty/worktrunk/releases/download"
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl --proto '=https' --tlsv1.2 -LsSf \
            "$release/v0.71.0/worktrunk-installer.sh" \
            --output "$installer"
          sh "$installer"
          wt --version
      - name: Install pinned Windows Worktrunk and psmux
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/install-windows-smoke-tools.ps1
      - name: Native macOS platform smoke
        if: runner.os == 'macOS'
        run: scripts/platform-smoke.sh
      - name: Full Linux/macOS gate
        if: runner.os != 'Windows'
        run: scripts/full-check.sh
      - name: Full native Windows gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/windows-check.ps1
      - name: Smoke-test Prism's real Worktrunk integration
        if: runner.os != 'Windows'
        run: |
          set -eu
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          export WORKTRUNK_CONFIG_PATH="$smoke_root/worktrunk.toml"
          worktrees="$smoke_root/worktrees"
          export WORKTRUNK_WORKTREE_PATH="$worktrees/{{ branch | sanitize }}"
          export PRISM_TEST_WORKTRUNK="$(command -v wt)"
          test_name="repository::worktrunk::tests::"
          test_name+="real_worktrunk_create_observe_remove_smoke"
          cargo test "$test_name" -- --ignored --exact
      - name: Test real OpenCode integration
        if: runner.os == 'Linux'
        run: |
          test_name="agent_runtime::opencode::tests::"
          test_name+="real_opencode_server_round_trips_prism_session_api"
          PRISM_TEST_OPENCODE="$(command -v opencode)" \
            cargo test "$test_name" -- --ignored --exact
      - name: Test real Prism, OpenCode, and tmux stack
        if: runner.os == 'Linux'
        run: |
          PRISM_TEST_OPENCODE="$(command -v opencode)" \
          PRISM_TEST_TMUX="$(command -v tmux)" \
            cargo test \
              real_prism_opencode_tmux_stack_ensures_reusable_agent_session \
              -- --ignored --exact
      - name: Native Windows Git, Worktrunk, OpenCode, and psmux smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PRISM_TEST_OPENCODE = (Get-Command opencode.cmd).Source
          scripts/windows-platform-smoke.ps1
