name: Remote compatibility

on:
  schedule:
    - cron: "17 5 * * 6"
  workflow_dispatch:
    inputs:
      compatibility:
        description: Local compatibility suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - gitlab
          - forgejo
          - none
      drift_probes:
        description: Run read-only public-host drift probes
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: remote-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-compatibility:
    name: Local ${{ matrix.provider }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider: [gitlab, forgejo]
    steps:
      - name: Select compatibility suite
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROVIDER: ${{ matrix.provider }}
          REQUESTED_SUITE: ${{ inputs.compatibility }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$REQUESTED_SUITE" == "all" || "$REQUESTED_SUITE" == "$PROVIDER" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "SKIP: $PROVIDER compatibility was not selected"
          fi
      - name: Checkout repository
        if: steps.selection.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        if: steps.selection.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
      - name: Run pinned local compatibility suite
        if: steps.selection.outputs.run == 'true'
        run: scripts/remote-compatibility.sh "${{ matrix.provider }}"

  public-drift:
    name: Public-host read-only drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select drift probes
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_DRIFT: ${{ inputs.drift_probes }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$RUN_DRIFT" == "true" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "SKIP: public-host drift probes were not selected"
          fi
      - name: Checkout repository
        if: steps.selection.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Validate drift probe schemas
        if: steps.selection.outputs.run == 'true'
        run: scripts/remote-drift-probe.sh self-test
      - name: Probe public hosts without credentials
        if: steps.selection.outputs.run == 'true'
        env:
          REMOTE_DRIFT_FAIL_UNAVAILABLE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          mkdir -p artifacts
          scripts/remote-drift-probe.sh all | tee artifacts/remote-drift.jsonl
      - name: Upload safe drift metadata
        if: always() && steps.selection.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-drift-metadata
          path: artifacts/remote-drift.jsonl
          if-no-files-found: ignore
          retention-days: 14
