name: Windows feasibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-feasibility.yml"
      - "docs/adr/0005-native-windows-mechanisms.md"
      - "scripts/windows-phase0-spikes.ps1"
      - "scripts/windows-check.ps1"
      - "scripts/windows-platform-smoke.ps1"
      - "scripts/install-windows-smoke-tools.ps1"
      - "spikes/windows/**"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tests/**"

concurrency:
  group: >-
    windows-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prism-preview:
    name: Prism phases 1-7 native contracts
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      # Swatinem/rust-cache v2.9.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Check native Windows compile boundary
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Run native process and IPC contracts
        shell: pwsh
        run: cargo test --locked windows_ -- --test-threads=1

  build:
    name: Build native spike executable
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      # Swatinem/rust-cache v2.9.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: spikes/windows -> target
      - name: Format, lint, and build
        shell: pwsh
        run: scripts/windows-phase0-spikes.ps1 -CheckOnly
      # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prism-windows-spike
          path: spikes/windows/target/debug/prism-windows-spikes.exe
          if-no-files-found: error
          retention-days: 1

  contracts:
    name: Contract (${{ matrix.spike }})
    needs: build
    runs-on: windows-2022
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        spike:
          - acl
          - process
          - worker-ipc
          - recorder
          - persistence
          - psmux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prism-windows-spike
          path: windows-spike
      - name: Run ${{ matrix.spike }} contract
        shell: pwsh
        run: |
          scripts/windows-phase0-spikes.ps1 `
            -Spike ${{ matrix.spike }} `
            -Executable windows-spike/prism-windows-spikes.exe
