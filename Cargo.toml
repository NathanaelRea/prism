[package]
name = "prism"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
description = "A terminal board for agent-backed coding sessions across Git worktrees"
license = "MIT"
repository = "https://github.com/NathanaelRea/prism"
readme = "README.md"
keywords = ["cli", "git", "terminal", "tmux", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.prism]
supported-operating-systems = ["linux", "macos"]

[dependencies]
ansi-to-tui = { version = "8.0.1", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = [
  "events",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
cron = "0.15"
libc = "0.2"
httpdate = "1"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
  "unstable-rendered-line-info",
] }
regex = "1.12.4"
rusqlite = { version = "0.40", features = ["bundled", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
toml = "=1.1.2"
toml_edit = "0.24"
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18", default-features = false, features = [
  "d_vendored",
] }
