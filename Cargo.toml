[package]
name = "prism"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
description = "A terminal board for agent-backed coding sessions across Git worktrees"
license = "MIT"
repository = "https://github.com/NathanaelRea/prism"
readme = "README.md"
keywords = ["cli", "git", "terminal", "tmux", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [
  ".",
  "crates/prism-extension-protocol",
  "crates/prism-extension-sdk",
  "standard-pack/extension",
]
resolver = "3"

[profile.test]
debug = "line-tables-only"

[package.metadata.prism]
supported-operating-systems = ["linux", "macos"]

[dependencies]
ansi-to-tui = { version = "8.0.1", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
cron = "0.15.0"
crossterm = { version = "0.29.0", default-features = false, features = [
  "events",
] }
libc = "0.2"
prism-extension-protocol = { path = "crates/prism-extension-protocol" }
httpdate = "1"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
  "unstable-rendered-line-info",
] }
regex = "1.12.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sqlx = { version = "0.8.6", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
toml = "=1.1.2"
toml_edit = "0.24"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }
url = "2.5"


[[bench]]
name = "workflow_control_plane"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18", default-features = false, features = [
  "d_vendored",
] }
