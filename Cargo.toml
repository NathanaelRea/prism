[package]
name = "prism"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
description = "A terminal board for agent-backed coding sessions across Git worktrees"
license = "MIT"
repository = "https://github.com/NathanaelRea/prism"
readme = "README.md"
keywords = ["cli", "git", "terminal", "tmux", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.prism]
supported-operating-systems = ["linux", "macos", "windows"]
archive-targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[dependencies]
ansi-to-tui = { version = "8.0.1", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = [
  "events",
] }
getrandom = "0.3"
libc = "0.2"
httpdate = "1"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
  "unstable-rendered-line-info",
] }
regex = "1.12.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sqlx = { version = "0.8.6", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
toml = "=1.1.2"
toml_edit = "0.24"
tokio = { version = "1", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }
url = "2.5"

[dev-dependencies]
sha2 = "0.10"

[[bench]]
name = "workflow_control_plane"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18", default-features = false, features = [
  "d_vendored",
] }

[target.'cfg(target_os = "windows")'.dependencies]
file-id = "0.2.3"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
interprocess = "2.4.3"
process-wrap = { version = "9.1.0", default-features = false, features = [
  "creation-flags",
  "job-object",
  "kill-on-drop",
  "std",
  "tokio1",
] }
widestring = "1.2.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
