schema_version = 2
name = "stabilize"
description = "Stabilize, approve, squash merge, and clean up an existing exact Change Request."
launch = ["manual"]
tags = ["ci", "review", "merge"]
capabilities = ["agent:run", "workspace:write", "process:run", "provider:read", "provider:write", "git:write", "worktrunk:write"]

[inputs.candidate]
type = "prism.change-request/v1"
required = true
from_context = true

[inputs.worktree]
type = "prism.worktree-session/v1"
required = true
from_context = true

[[steps]]
id = "stabilize"
class = "workflow_call"
workflow = "prism.standard/stabilize-change-request"
inputs = { candidate = "inputs.candidate", worktree = "inputs.worktree" }
skippable = false

[steps.repeat]
until = "steps.stabilize.outputs.ready == true"
max_iterations = 3
on_exhausted = "input_required"
successor = { candidate = "candidate" }

[[steps]]
id = "ci-gate"
class = "gate"
use = "prism.standard/gate"
inputs = { request = "steps.stabilize.outputs.ci" }
skippable = false

[[steps]]
id = "review-gate"
class = "gate"
use = "prism.standard/gate"
depends_on = ["stabilize"]
inputs = { request = "steps.stabilize.outputs.review" }
skippable = false

[[steps]]
id = "policy-gate"
class = "gate"
use = "prism.standard/gate"
depends_on = ["stabilize"]
inputs = { request = "steps.stabilize.outputs.policy" }
skippable = false

[[steps]]
id = "mergeability-gate"
class = "gate"
use = "prism.standard/gate"
depends_on = ["stabilize"]
inputs = { request = "steps.stabilize.outputs.mergeability" }
skippable = false

[[steps]]
id = "merge-relation-gate"
class = "gate"
use = "prism.standard/gate"
depends_on = ["stabilize"]
inputs = { request = "steps.stabilize.outputs.merge_relation" }
skippable = false

[[steps]]
id = "approve-exact-head"
class = "approval"
use = "prism.standard/merge-approval"
depends_on = ["ci-gate", "review-gate", "policy-gate", "mergeability-gate", "merge-relation-gate"]
inputs = { candidate = "steps.stabilize.outputs.candidate", ci = "steps.ci-gate.outputs.result", review = "steps.review-gate.outputs.result", policy = "steps.policy-gate.outputs.result", mergeability = "steps.mergeability-gate.outputs.result", merge_relation = "steps.merge-relation-gate.outputs.result" }
skippable = false

[[steps]]
id = "revalidate"
class = "action"
use = "prism.standard/reobserve-change-request"
inputs = { original = "steps.stabilize.outputs.candidate", successor = "steps.stabilize.outputs.candidate" }
skippable = false

[[steps]]
id = "revalidate-gates"
class = "gate"
use = "prism.standard/revalidate-merge"
inputs = { observation = "steps.revalidate.outputs.observation" }
skippable = false

[[steps]]
id = "squash-merge"
class = "action"
use = "prism.standard/squash-merge-exact-head"
inputs = { candidate = "steps.stabilize.outputs.candidate", gates = "steps.revalidate-gates.outputs.result" }
skippable = false

[[steps]]
id = "cleanup"
class = "action"
use = "prism.standard/delete-exact-worktree"
inputs = { worktree = "inputs.worktree", merged = "steps.squash-merge.outputs.merged" }
skippable = false

[[steps]]
id = "notify"
class = "notification"
use = "prism.standard/notification"
inputs = { request = "steps.cleanup.outputs.notification" }
skippable = false
