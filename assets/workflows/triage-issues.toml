schema_version = 2
name = "triage-issues"
description = "Discover and classify provider Issues before an explicit admission decision."
launch = ["manual", "trigger"]
tags = ["triage", "issues"]
capabilities = ["provider:read"]

[inputs.intake]
type = "prism.issue-intake/v1"
required = true

[[steps]]
id = "classify"
class = "action"
use = "prism.standard/classify-issue"
inputs = { intake = "inputs.intake" }
skippable = false

[[steps]]
id = "admission"
class = "approval"
use = "prism.standard/issue-admission"
inputs = { classification = "steps.classify.outputs.classification" }
skippable = false
