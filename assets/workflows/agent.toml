schema_version = 1
name = "agent"
description = "Run one isolated harness-backed Agent Attempt in a claimed workspace."
capabilities = ["workspace_write", "process_execute"]

[inputs.task]
artifact_type = "builtin:task@1"

[budgets]
max_attempts = 3
max_fan_out = 1
max_child_depth = 0
max_mutations = 0

[[steps]]
id = "agent"
class = "action"
implementation = "builtin:agent@1"
capabilities = ["workspace_write", "process_execute"]

[steps.inputs.task]
from = "run.task"
artifact_type = "builtin:task@1"

[steps.outputs.result]
artifact_type = "builtin:task@1"
