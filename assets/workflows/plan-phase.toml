schema_version = 1
name = "plan-phase"
description = "Implement one immutable phase from a validated Plan Artifact in an isolated workspace."
capabilities = ["repository_read", "workspace_write", "process_execute", "git_commit"]

[inputs.plan]
artifact_type = "builtin:plan@1"

[budgets]
max_attempts = 3
max_fan_out = 1
max_child_depth = 0
max_mutations = 1

[[steps]]
id = "implement"
class = "action"
implementation = "builtin:implement-plan-phase@1"
capabilities = ["repository_read", "workspace_write", "process_execute"]

[steps.settings]
prompt = "Implement only the selected phase from the immutable Plan Artifact. Preserve its stable phase ID and declared dependencies."
retry = { max_attempts = 2, backoff_ms = 1000 }
continuation = "reject"

[steps.inputs.plan]
from = "run.plan"
artifact_type = "builtin:plan@1"

[steps.outputs.result]
artifact_type = "builtin:commit@1"

[[steps]]
id = "promote"
class = "action"
implementation = "builtin:promote-workspace@1"
depends_on = ["implement"]
capabilities = ["git_commit"]

[steps.inputs.commit]
from = "implement.result"
artifact_type = "builtin:commit@1"

[steps.outputs.commit]
artifact_type = "builtin:commit@1"
