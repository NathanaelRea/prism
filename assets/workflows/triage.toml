schema_version = 1
name = "triage"
description = "Quarantined provider-item classification and admission workflow."
capabilities = ["provider_read", "process_execute"]

[inputs.item]
artifact_type = "builtin:provider-item-observation@1"

[budgets]
max_attempts = 4
max_fan_out = 1
max_child_depth = 1
max_mutations = 0

[[steps]]
id = "classify"
class = "action"
implementation = "builtin:classify-provider-item@1"
capabilities = ["provider_read", "process_execute"]
[steps.inputs.item]
from = "run.item"
artifact_type = "builtin:provider-item-observation@1"
[steps.outputs.classification]
artifact_type = "builtin:classification@1"

[[steps]]
id = "admit"
class = "approval"
implementation = "builtin:admit-provider-item@1"
depends_on = ["classify"]
[steps.inputs.item]
from = "run.item"
artifact_type = "builtin:provider-item-observation@1"
[steps.outputs.decision]
artifact_type = "builtin:human-attestation@1"
