schema_version = 2
name = "plan"
description = "Select or create a typed Plan, then implement its next phase as a child run."
launch = ["manual"]
tags = ["planning"]
capabilities = ["agent:run", "workspace:write", "process:run"]

[parameters]
require_approval = false

[inputs.plan_source]
type = "prism.plan-source/v1"
required = true

[inputs.worktree]
type = "prism.worktree-session/v1"
required = true
from_context = true

[outputs.plan]
type = "prism.plan/v1"
from = "steps.select-plan.outputs.result"

[outputs.candidate]
type = "prism.candidate-change/v1"
from = "steps.implement-phase.outputs.candidate"

[[steps]]
id = "select-plan"
class = "action"
use = "prism.standard/plan-parse"
inputs = { request = "inputs.plan_source" }
skippable = false

[[steps]]
id = "approve-plan-revision"
class = "approval"
use = "prism.standard/plan-approval"
inputs = { plan = "steps.select-plan.outputs.result" }
condition = "parameters.require_approval == true"
on_unknown = "fail"
settings = { summary = "Approve the exact selected Plan Artifact revision" }
skippable = false

[[steps]]
id = "select-phase"
class = "action"
use = "prism.standard/plan-phase-task"
inputs = { plan = "steps.select-plan.outputs.result" }
skippable = false

[[steps]]
id = "implement-phase"
class = "workflow_call"
workflow = "prism.standard/implement"
inputs = { task = "steps.select-phase.outputs.task", worktree = "inputs.worktree" }
skippable = false

[steps.repeat]
until = "steps.implement-phase.outputs.plan_complete == true"
max_iterations = 32
on_exhausted = "input_required"
successor = { task = "next_task" }
