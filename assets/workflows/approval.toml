schema_version = 1
name = "approval"
description = "Request evidence-bound approval for an immutable task."
capabilities = []

[inputs.task]
artifact_type = "builtin:task@1"

[budgets]
max_attempts = 4
max_fan_out = 1
max_child_depth = 1
max_mutations = 0

[[steps]]
id = "approve"
class = "approval"
implementation = "builtin:approval@1"

[steps.inputs.task]
from = "run.task"
artifact_type = "builtin:task@1"

[steps.outputs.decision]
artifact_type = "builtin:human-attestation@1"
